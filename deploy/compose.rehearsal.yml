# A LOCAL, production-LIKE rehearsal of the two application images. It exists to prove the images and the topology on
# one machine; it is NOT the production definition.
#
#   production (intended):  Internet -> Coolify proxy (TLS) -> frontend/BFF -> private backend -> Coolify-MANAGED PostgreSQL 17
#   this file (rehearsal):  127.0.0.1:${REHEARSAL_PORT} -> frontend/BFF -> private backend -> a DISPOSABLE postgres container
#
# The rehearsal database is only here because a laptop has no Coolify-managed PostgreSQL; it is on tmpfs and is gone
# when the stack goes down. Only the FRONTEND is published to the host (and only on loopback). The backend and the
# database publish nothing: they are reachable only by service name on the stack's private network.
#
# Rehearsal-only deviation: the frontend runs with APP_ENV=development because the rehearsal is plain http on
# localhost (production requires an https PUBLIC_ORIGIN and the __Host- cookies; the image tests start the image with
# APP_ENV=production separately). The backend runs with the production rules (APP_ENV=production, AUTH_MODE=session).
#
# Migrations are NOT run by any service here (nor by the web process): the tests run Alembic explicitly:
#   docker compose -f deploy/compose.rehearsal.yml run --rm --no-deps backend python -m alembic upgrade head
#
# Required variables (no defaults for secrets): REHEARSAL_DB_PASSWORD, REHEARSAL_SECURITY_KEY (at least 32 characters).
name: ${REHEARSAL_PROJECT:-bp-rehearsal}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: ${REHEARSAL_DB_PASSWORD:?set REHEARSAL_DB_PASSWORD}
      POSTGRES_DB: bp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp -d bp"]
      interval: 3s
      timeout: 3s
      retries: 20
    # no ports: private to the stack

  backend:
    build:
      context: ../backend
    image: ${REHEARSAL_BACKEND_IMAGE:-bp-rehearsal-backend}
    environment:
      APP_ENV: production
      AUTH_MODE: session
      SECURITY_KEY: ${REHEARSAL_SECURITY_KEY:?set REHEARSAL_SECURITY_KEY (32+ characters)}
      DATABASE_URL: postgresql+psycopg://bp:${REHEARSAL_DB_PASSWORD}@postgres:5432/bp
      PUBLIC_ORIGIN: http://127.0.0.1:${REHEARSAL_PORT:-3300}
      CORS_ORIGINS: "[]"
    depends_on:
      postgres:
        condition: service_healthy
    # no ports: reachable only from the frontend, by name

  frontend:
    build:
      context: ../frontend
    image: ${REHEARSAL_FRONTEND_IMAGE:-bp-rehearsal-frontend}
    environment:
      AUTH_MODE: session
      APP_ENV: development
      PUBLIC_ORIGIN: http://127.0.0.1:${REHEARSAL_PORT:-3300}
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:${REHEARSAL_PORT:-3300}:3000"
