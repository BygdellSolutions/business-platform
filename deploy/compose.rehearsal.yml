# A LOCAL, production-LIKE rehearsal of the two application images. It exists to prove the images, the startup order and the
# topology on one machine; it is NOT the production definition, and `depends_on` here is NOT evidence of how Coolify behaves
# (replacement semantics are verified in D5).
#
#   production (intended):  Internet -> Coolify proxy (TLS) -> frontend/BFF -> private backend -> Coolify-MANAGED PostgreSQL 17
#   this file (rehearsal):  127.0.0.1:${REHEARSAL_PORT} -> frontend/BFF -> private backend -> a DISPOSABLE postgres container
#
# Startup order (the local implementation of "a failed migration prevents a healthy deployment"):
#
#   postgres (healthy)
#     -> db-bootstrap   one-shot: creates the two roles (owner, app) and their grants
#     -> migrate        one-shot: `python -m app.scripts.migrate` as the OWNER role, under the advisory lock
#         (completed successfully)
#     -> backend        runs as the APP role; its health check is READINESS (database reachable AND at exactly this
#         (healthy)     image's Alembic head); it never migrates
#     -> frontend       its health check is LIVENESS only (/api/health); /api/ready is the whole-chain readiness
#
# If migrate fails, the backend and the frontend are never started. The rehearsal database is on tmpfs and is gone when the
# stack goes down. Only the FRONTEND is published to the host (and only on loopback).
#
# Rehearsal-only deviations: the frontend runs with APP_ENV=development because the rehearsal is plain http on localhost
# (production requires an https PUBLIC_ORIGIN and the __Host- cookies; the image tests start the image with APP_ENV=production
# separately), and the backend's PUBLIC_ORIGIN is a placeholder https origin (production requires https; the backend uses it
# only to print operator setup links).
#
# Required variables (no defaults for secrets): REHEARSAL_DB_PASSWORD, REHEARSAL_SECURITY_KEY, REHEARSAL_BFF_SECRET,
# REHEARSAL_OWNER_PASSWORD, REHEARSAL_APP_PASSWORD (secrets of at least 32 characters where stated by the application).
name: ${REHEARSAL_PROJECT:-bp-rehearsal}

x-backend-image: &backend-image
  build:
    context: ../backend
  image: ${REHEARSAL_BACKEND_IMAGE:-bp-rehearsal-backend}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bp # the BOOTSTRAP superuser: only db-bootstrap (and the test harness) ever connects as it
      POSTGRES_PASSWORD: ${REHEARSAL_DB_PASSWORD:?set REHEARSAL_DB_PASSWORD}
      POSTGRES_DB: bp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp -d bp"]
      interval: 3s
      timeout: 3s
      retries: 20
    # no ports: private to the stack

  db-bootstrap:
    <<: *backend-image
    command: ["python", "-m", "app.scripts.bootstrap_roles"]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://bp:${REHEARSAL_DB_PASSWORD}@postgres:5432/bp
      OWNER_ROLE: bp_owner
      OWNER_PASSWORD: ${REHEARSAL_OWNER_PASSWORD:?set REHEARSAL_OWNER_PASSWORD}
      APP_ROLE: bp_app
      APP_PASSWORD: ${REHEARSAL_APP_PASSWORD:?set REHEARSAL_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend-image
    command: ["python", "-m", "app.scripts.migrate"]
    environment:
      APP_ENV: production
      MIGRATION_DATABASE_URL: postgresql+psycopg://bp_owner:${REHEARSAL_OWNER_PASSWORD}@postgres:5432/bp
      RUNTIME_DB_ROLE: bp_app
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      APP_ENV: production
      AUTH_MODE: session
      SECURITY_KEY: ${REHEARSAL_SECURITY_KEY:?set REHEARSAL_SECURITY_KEY (32+ characters)}
      BFF_INTERNAL_SECRET: ${REHEARSAL_BFF_SECRET:?set REHEARSAL_BFF_SECRET (32+ characters)}
      DATABASE_URL: postgresql+psycopg://bp_app:${REHEARSAL_APP_PASSWORD}@postgres:5432/bp
      PUBLIC_ORIGIN: https://rehearsal.example.test
      CORS_ORIGINS: "[]"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # no ports: reachable only from the frontend, by name. The image's HEALTHCHECK is readiness.

  frontend:
    build:
      context: ../frontend
    image: ${REHEARSAL_FRONTEND_IMAGE:-bp-rehearsal-frontend}
    environment:
      AUTH_MODE: session
      APP_ENV: development
      PUBLIC_ORIGIN: http://127.0.0.1:${REHEARSAL_PORT:-3300}
      BACKEND_URL: http://backend:8000
      BFF_INTERNAL_SECRET: ${REHEARSAL_BFF_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REHEARSAL_PORT:-3300}:3000"
