# STAGING (D5) deployment definition for Coolify: Docker Compose build pack, built from this repository.
# Under review on the `d5-staging` branch; it is not the production definition until D5 is reviewed.
#
#   Internet -> Cloudflare tunnel -> Coolify proxy (Traefik) -> frontend/BFF -> private backend -> Coolify-MANAGED PostgreSQL 17
#
# The database is a separate Coolify resource with its own lifecycle (never a service in this file). The roles are created ONCE
# per database by deploy/compose.coolify-bootstrap.yml, which is then removed, so no superuser credential lives here.
#
# Order on every deployment: migrate (one-shot, owner role, advisory lock, exact head, grant reconciliation; must COMPLETE
# successfully) -> backend (app role; its image health check is READINESS: exact Alembic head) -> frontend (liveness).
# A failed or refused migration leaves the backend and frontend of this deployment unstarted. How Coolify treats that (whether it
# reports the deployment as failed, what happens to the previous containers) is what D5 observes; it is not assumed here.
#
# Every value comes from Coolify's environment configuration for this resource; nothing secret is in this file. `:?` makes a
# missing value fail the deployment instead of starting with an empty one.

x-backend-build: &backend-build
  build:
    context: ../backend

services:
  migrate:
    <<: *backend-build
    command: ["python", "-m", "app.scripts.migrate"]
    environment:
      APP_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL (owner role)}
      RUNTIME_DB_ROLE: ${RUNTIME_DB_ROLE:?set RUNTIME_DB_ROLE}
    restart: "no"

  backend:
    <<: *backend-build
    environment:
      APP_ENV: production
      AUTH_MODE: session
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (app role)}
      SECURITY_KEY: ${SECURITY_KEY:?set SECURITY_KEY}
      BFF_INTERNAL_SECRET: ${BFF_INTERNAL_SECRET:?set BFF_INTERNAL_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      CORS_ORIGINS: "[]"
      TRUST_CLIENT_IP_HEADER: ${TRUST_CLIENT_IP_HEADER:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # no ports: reachable only from the frontend, by service name

  frontend:
    build:
      context: ../frontend
    environment:
      APP_ENV: production
      AUTH_MODE: session
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      BACKEND_URL: http://backend:8000
      BFF_INTERNAL_SECRET: ${BFF_INTERNAL_SECRET:?set BFF_INTERNAL_SECRET}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    depends_on:
      backend:
        condition: service_healthy
    # no ports: Coolify's proxy routes the staging domain to port 3000
