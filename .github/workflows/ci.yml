name: CI

# The correctness gates of business-platform. Everything here runs on disposable infrastructure ONLY: the runner's own
# tmpfs PostgreSQL (.github/actions/disposable-db), containers built from this checkout, and credentials generated by the job
# itself. No workflow reads a repository/deployment secret, the development database, staging, production, a backup or Coolify
# (the static tests in backend/tests/test_ci_workflows.py fail if one is introduced). See docs/architecture.md, "Continuous
# integration (D3 as built)", for the job graph, the required-check recommendation and how to reproduce each job locally.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request cancels the obsolete run. A push to main NEVER cancels another run (its group is
# unique per run), so no required main/deployment gate can be hidden by a later push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files (actionlint)
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install from uv.lock (frozen)
        working-directory: backend
        run: uv sync --frozen
      - uses: ./.github/actions/disposable-db
        with:
          label: backend
      - name: Backend tests (everything except the two suites below; includes the architecture and workflow boundary tests)
        working-directory: backend
        run: |
          mkdir -p ../ci-logs
          uv run pytest -q -p no:cacheprovider --ignore=tests/test_migrate_runner.py --ignore=tests/test_db_roles.py 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/backend-tests.log
      - name: The migration job (real processes - concurrency, lock, refusal, failure)
        working-directory: backend
        run: |
          uv run pytest -q -p no:cacheprovider tests/test_migrate_runner.py 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/backend-migrate.log
      - name: The restricted runtime role (DDL denied, future objects usable, the app suite as that role)
        working-directory: backend
        run: |
          uv run pytest -q -p no:cacheprovider tests/test_db_roles.py 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/backend-roles.log
      - name: Migrate a fresh database with the actual migration job, then alembic upgrade head and alembic check
        working-directory: backend
        run: |
          docker compose exec -T postgres-test psql -v ON_ERROR_STOP=1 -U ci_admin -d business_platform_test -c 'create database ci_migrate_test'
          export APP_ENV=development
          export MIGRATION_DATABASE_URL="${TEST_DATABASE_URL%/*}/ci_migrate_test"
          uv run python -m app.scripts.migrate 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/backend-fresh-migrate.log
          uv run alembic upgrade head
          # `check` compares the models with the schema, so it also needs the web settings (DATABASE_URL, here the same disposable database)
          DATABASE_URL="${MIGRATION_DATABASE_URL}" uv run alembic check
      - name: Upload the redacted logs of a failed job
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs
          path: ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test
      # No AUTH_MODE, APP_ENV, PUBLIC_ORIGIN, BACKEND_URL, secret or network font access: one image for every environment.
      - name: Production build (no configuration at build time)
        working-directory: frontend
        run: npm run build

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the test dependencies from uv.lock (frozen)
        working-directory: backend
        run: uv sync --frozen
      - name: Docker and Compose
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
      # Builds both production Dockerfiles WITHOUT a layer cache (clean-build guarantees) and runs the D1 + D2 suite: images,
      # non-root users, one worker, PDF and fonts, standalone runtime, published ports, the migration orchestration, exact-head
      # readiness, the BFF internal secret and the restricted runtime role. Each test stack has a unique Compose project name.
      - name: Container, topology and orchestration suite
        working-directory: backend
        run: |
          mkdir -p ../ci-logs
          uv run pytest ../deploy/tests -q -p no:cacheprovider 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/containers.log
      - name: Upload the redacted log of a failed job
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containers-log
          path: ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e-dev:
    name: e2e-dev
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend (frozen) and the frontend
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: Install the one browser the run uses (and its system libraries)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/disposable-db
        with:
          label: e2e-dev
      - name: Playwright, dev identity
        working-directory: frontend
        run: |
          mkdir -p ../ci-logs
          npm run test:e2e 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/e2e-dev.log
      - name: Upload the redacted log of a failed job
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-dev-log
          path: ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e-session:
    name: e2e-session
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend (frozen) and the frontend
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: Install the one browser the run uses (and its system libraries)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/disposable-db
        with:
          label: e2e-session
      # This job's own disposable credentials: generated, masked, never echoed, never stored anywhere but this job's environment.
      - name: Generate this job's credentials (BFF internal secret, security key, test password)
        run: |
          set -euo pipefail
          for name in E2E_BFF_SECRET E2E_SECURITY_KEY E2E_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done
      - name: Playwright, real sessions (BFF internal secret enforced end to end)
        working-directory: frontend
        run: |
          mkdir -p ../ci-logs
          npm run test:e2e:session 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/e2e-session.log
      - name: Upload the redacted log of a failed job
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-session-log
          path: ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  # One stable name for branch protection: green only if EVERY gate above succeeded (a skipped or cancelled gate is a failure).
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [workflows, backend, frontend, containers, e2e-dev, e2e-session]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          print(results)
          sys.exit(0 if results and all(result == "success" for result in results.values()) else 1)
          PY
