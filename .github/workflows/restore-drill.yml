name: Restore drill

# The D4 backup/restore drill, on demand and weekly. NOT a pull-request or merge gate and not part of `ci-gate`: it builds the production
# backend image, starts two DISPOSABLE PostgreSQL 17 containers, backs up a synthetic representative database with the real pg_dump,
# restores it into a separate database with different role names, verifies it and serves it with the real backend as the restricted
# role (deploy/drill/test_restore_drill.py). It touches no real database, backup, storage or credential: nothing here holds a secret and
# every password is generated by the test. The guard and tool-logic tests (fake PostgreSQL clients) already run in ci.yml's backend job.
# Why separate: a slow or flaky disposable drill must not block a merge; the regular run still catches drift in the real clients.
# Policy: docs/backup-restore.md, "CI boundary".

on:
  schedule:
    - cron: "47 5 * * 2" # Tuesdays 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  drill:
    name: drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the test dependencies from uv.lock (frozen)
        working-directory: backend
        run: uv sync --frozen
      - name: Docker
        run: docker version --format '{{.Server.Version}}'
      - name: Back up, restore, verify and serve a synthetic database (the measured record is in the log)
        working-directory: backend
        run: |
          mkdir -p ../ci-logs
          uv run pytest ../deploy/drill -q -s -p no:cacheprovider 2>&1 | python ../.github/scripts/redact.py | tee ../ci-logs/restore-drill.log
      - name: Upload the redacted log of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-log
          path: ci-logs/*.log
          retention-days: 7
          if-no-files-found: ignore
